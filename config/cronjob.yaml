apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-archive-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-archiver
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: log-archiver
        spec:
          restartPolicy: OnFailure
          containers:
            - name: log-archiver
              image: bitnami/kubectl:latest
              command:
                - sh
                - -c
                - |
                  ARCHIVE_DIR=/archive
                  find "$ARCHIVE_DIR" -type f -mtime +7 -exec rm -f {} \;
                  TIMESTAMP=$(date +%Y%m%d%H%M%S)
                  mkdir -p "$ARCHIVE_DIR/logs-$TIMESTAMP"
                  PODS=$(kubectl get pods -l app=log-agent -o jsonpath='{.items[*].metadata.name}')
                  for POD in $PODS; do
                    kubectl logs "$POD" > "$ARCHIVE_DIR/logs-$TIMESTAMP/$POD.log"
                  done
                  tar -czf "$ARCHIVE_DIR/app-logs-$TIMESTAMP.tar.gz" -C "$ARCHIVE_DIR" "logs-$TIMESTAMP"
              volumeMounts:
                - name: archive-vol
                  mountPath: /archive
          volumes:
            - name: archive-vol
              persistentVolumeClaim:
                claimName: log-archive-pvc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-log-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io